name: RSREU sync

on:
  schedule:
    # Every 12 hours (UTC). Matches SCHEDULE_SYNC_HOURS=12 on the bot.
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Open Postgres tunnel via VPS
        run: |
          ssh -f -N \
            -i ~/.ssh/deploy_key \
            -o ExitOnForwardFailure=yes \
            -L 15432:127.0.0.1:5432 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

      - name: Sync RSREU to database
        env:
          UNITIME_SKIP_BOT_TOKEN: "1"
          DATABASE_URL: postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:15432/${{ secrets.POSTGRES_DB }}
        run: python scripts/sync_rsreu_to_db.py
