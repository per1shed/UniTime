services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unitime}
      POSTGRES_USER: ${POSTGRES_USER:-unitime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unitime_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unitime} -d ${POSTGRES_DB:-unitime}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-unitime}:${POSTGRES_PASSWORD:-unitime_secret}@db:5432/${POSTGRES_DB:-unitime}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
